[workspace]
resolver = "3"
members = ["crates/*", "tools/worldcmp"]

# Every external crate is declared here once and used with `workspace = true`; a crate adds only the features it needs.
[workspace.dependencies]
aes = "0.9.4"
base64 = "0.23"
cfb8 = "0.9.1"
chrono = "0.4"
flate2 = "1.1.10"
futures-util = { version = "0.3", default-features = false }
indexmap = "2"
libc = "0.2"
linkme = "0.3"
log = "0.4"
# The hash crates (`md-5`, `sha1`, `sha2`) stay on `digest` 0.10: `rsa` 0.9 verifies signatures through it, and `uuid`,
# `p12-keystore` and `tungstenite` use it too. Using `digest` 0.11 as well would compile each hash twice.
md-5 = "0.11"
p12-keystore = "0.4"
parking_lot = "0.13"
proc-macro2 = "1"
quote = "1"
rand = "0.10"
# `rsa` 0.9 takes `rand_core` 0.6 generators, so this stays one generation behind `rand`.
rand_core = "0.6.4"
regex = "1"
reqwest = { version = "0.13.5", default-features = false }
rsa = "0.9.10"
serde = "1.0.229"
# One serde_json feature set for every crate and build config: Gson-like insertion order (vanilla's JsonObject is a
# LinkedTreeMap) and exact decimal parsing. Without this, a crate's isolated tests saw sorted maps while the server
# binary (feature-unified) saw file order.
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.11"
sha2 = "0.11"
signal-hook = "0.4"
syn = "3"
tempfile = "3"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-rustls = "0.26"
tokio-tungstenite = "0.30"
twox-hash = { version = "2", default-features = false }
uuid = "1.29.0"
zip = { version = "9", default-features = false }

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/dodoflix/minecraft"
rust-version = "1.97"
publish = false

# Lint policy: docs/standards.md. A lint stays at `warn` while the code does not meet it yet and becomes `deny` in the
# change that brings its count to zero.
# `unsafe_code` is not set: every `linkme` registration expands to a `#[link_section]` static, which that lint flags
# hundreds of times. Direct `unsafe` is covered by `undocumented_unsafe_blocks` and review.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
ignore_without_reason = "deny"
# The next three lints fire on code that mirrors vanilla's shapes (negated float comparisons, `Foo::foo` modules,
# `next()`-style method names); mirroring wins, so they are off for the whole workspace.
neg_cmp_op_on_partial_ord = "allow"
module_inception = "allow"
should_implement_trait = "allow"

# Line-table debuginfo and no incremental caches keep each checkout's target/ small.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = false
# A malformed packet must close that connection, not stop the server: per-packet panics are caught, so unwinding stays on.
panic = "unwind"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
debug = 1
panic = "unwind"

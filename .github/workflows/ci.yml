# Full build + test on GitHub's runners (public repo: unlimited minutes).
# - every push to main: catches a broken main within minutes and names the commit
# - on demand for any branch (agents): `gh workflow run ci.yml --ref <branch>` then `gh run watch`
#   (optionally `-f test_filter='-p mc-game --test foo'` to run a subset)
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_filter:
        description: "extra cargo test args (default: whole workspace)"
        required: false
        default: "--workspace"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # ref/ = vanilla jar, unbundled libs, datagen reports, extractor output (gitignored; rebuilt from Mojang's download)
      - name: Cache ref/
        id: ref-cache
        uses: actions/cache@v4
        with:
          path: ref
          key: ref-26.3-${{ hashFiles('scripts/setup-ref.sh', 'scripts/extract.sh', 'tools/extractor/**') }}

      - name: Build ref/ (download vanilla 26.3, datagen, extractor)
        if: steps.ref-cache.outputs.cache-hit != 'true'
        run: scripts/setup-ref.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build (workspace, tests)
        run: cargo build --workspace --tests

      - name: Build mc-server binary (for server-level tests)
        run: cargo build -p mc-server

      - name: Test
        env:
          MC_SERVER_BIN: ${{ github.workspace }}/target/debug/mc-server
        run: cargo test ${{ inputs.test_filter || '--workspace' }} -- --test-threads=2

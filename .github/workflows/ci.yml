# Full build + test on GitHub's runners (public repo: unlimited minutes).
# - scheduled: a complete run of main's tip every 2 hours
# - on demand for any branch: `gh workflow run ci.yml --ref <branch>` then `gh run watch`
#   (optionally `-f test_filter='-p mc-game --test foo'` or `-p mc-game-core --test foo` to run a subset)
name: ci

on:
  # main moves every few seconds, so per-push runs were almost all cancelled; a scheduled full run of main's tip
  # gives one complete, comparable result every 2 hours.
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      test_filter:
        description: "extra cargo test args (default: whole workspace)"
        required: false
        default: "--workspace"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # runners have ~14 GB free disk; full debuginfo for all test binaries would not fit
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # ref/ = vanilla jar, unbundled libs, datagen reports, extractor output (gitignored; rebuilt from Mojang's download)
      - name: Cache ref/
        id: ref-cache
        uses: actions/cache@v4
        with:
          path: ref
          key: ref-26.3-${{ hashFiles('scripts/setup-ref.sh', 'scripts/extract.sh', 'tools/extractor/**') }}

      - name: Build ref/ (download vanilla 26.3, datagen, extractor)
        if: steps.ref-cache.outputs.cache-hit != 'true'
        run: scripts/setup-ref.sh

      - name: Fingerprint ref/ (compare with a local `sha256sum` to catch JVM-dependent generator output)
        run: (cd ref && sha256sum generated/reports/*.json extracted/*.json) | tee ref-fingerprint.txt

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build (workspace, tests)
        run: cargo build --workspace --tests

      - name: Build mc-server binary (for server-level tests)
        run: cargo build -p mc-server

      - name: Test
        env:
          MC_SERVER_BIN: ${{ github.workspace }}/target/debug/mc-server
          TEST_FILTER: ${{ inputs.test_filter || '--workspace' }}
        # mc-core float goldens depend on libm matching Java; a failure only there on CI is a platform issue
        run: cargo test --no-fail-fast $TEST_FILTER -- --test-threads=2

# Pull request and main checks. `ci-ok` is the single required status check: it passes only when every job passes.
# - fmt, deny, hygiene, commits: no vanilla reference needed
# - clippy, test: need ref/ (the `ref` job builds it once per script change and caches it)
# - test counts only failures that tests/known-failures.txt does not list (scripts/test-known-failures.py)
# - the oracle tier (real vanilla server) and the advisory scan run in nightly.yml
# Also runs on demand for any branch: `gh workflow run ci.yml --ref <branch>`, then `gh run watch`.
name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Main moves often: one run at a time, the newest waiting run replaces older waiting ones. Other refs cancel stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # runners have ~14 GB free disk; full debuginfo for all test binaries would not fit
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  ref:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ref

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show
      - run: cargo fmt --all --check

  clippy:
    needs: ref
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ref
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked --keep-going -- -D warnings

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny
      # Advisories change without a code change: they run in nightly.yml and never block a pull request.
      - run: cargo deny --locked check licenses bans sources

  # scripts/check.sh --fast: fmt and deny again (seconds), plus shellcheck, ruff and the source hygiene greps.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny
      - name: Install ruff
        run: pipx install ruff==0.17.4
      # shellcheck is preinstalled on the runner image.
      - run: scripts/check.sh --fast

  # Pull requests only: the title (the squash-merge commit message) and every commit. Maintainer pushes to main go
  # through the local gate, which has the same check.
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned toolchain
        if: github.event_name == 'pull_request'
        run: rustup show
      - name: Check the PR title and commits
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commits.sh --title "$TITLE" "$BASE..$HEAD"

  test:
    needs: ref
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ref
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test (T0/T1)
        run: scripts/test-known-failures.py

  ci-ok:
    if: always()
    needs: [ref, fmt, clippy, deny, hygiene, commits, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null

# cargo-deny policy. `licenses`, `bans` and `sources` are deterministic and run in scripts/check.sh.
# `advisories` changes without any code change, so it is run on a schedule, not as part of the local check.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MIT-0",
  "Unlicense",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path dependencies carry no version

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Known and unresolved; documented in docs/standards.md. (The `zip` advisories are fixed by upgrading, not ignored.)
ignore = [
  # No patched release of `rsa` exists. Vanilla's login handshake requires the RSA-1024 key exchange.
  "RUSTSEC-2023-0071",
]

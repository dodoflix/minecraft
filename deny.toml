# cargo-deny policy. `licenses`, `bans` and `sources` are deterministic and run in scripts/check.sh.
# `advisories` changes without any code change, so it is run on a schedule, not as part of the local check.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MIT-0",
  "Unlicense",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true # workspace path dependencies carry no version

# Duplicate versions that remain after unifying our own manifests: an upstream crate pins the older generation, or the
# newer one is a deliberate choice. A new duplicate fails the check: unify it or add it here with the reason.
skip = [
  # `p12-keystore` (TLS key store loading) builds on the `aes` 0.8 cipher stack; `mc-protocol` deliberately uses `aes` 0.9
  # and `cfb8` 0.9 for AES-128/CFB8 (the 0.8 `cfb8` stream API consumes the cipher and does not fit a long-lived stream).
  { crate = "aes@0.8.4", reason = "p12-keystore -> pkcs5" },
  { crate = "cipher@0.4.4", reason = "aes 0.8 (p12-keystore)" },
  { crate = "cpufeatures@0.2.17", reason = "aes 0.8 (p12-keystore), sha1 0.10 and sha2 0.10 (rsa 0.9)" },
  { crate = "crypto-common@0.1.7", reason = "digest 0.10 (rsa 0.9, p12-keystore, sha1/sha2/md-5)" },
  { crate = "inout@0.1.4", reason = "cipher 0.4 (p12-keystore)" },
  # `rsa` 0.9 draws randomness through `rand_core` 0.6 (`mc-protocol` names it directly for `OsRng`), and its big-integer crate uses `rand` 0.8.
  { crate = "getrandom@0.2.17", reason = "rand_core 0.6 (rsa 0.9)" },
  { crate = "rand@0.8.8", reason = "num-bigint-dig (rsa 0.9)" },
  { crate = "rand_chacha@0.3.1", reason = "rand 0.8 (rsa 0.9)" },
  { crate = "rand_core@0.6.4", reason = "rsa 0.9 generators; named directly in mc-protocol" },
  # `rand` 0.9 and `getrandom` 0.3 are used by tungstenite and p12-keystore as well; uuid, tempfile and zip already use `getrandom` 0.4.
  { crate = "getrandom@0.3.4", reason = "rand_core 0.9 (rand 0.9)" },
  { crate = "r-efi@5.3.0", reason = "getrandom 0.3" },
  # Proc-macro stack: `serde_derive`, `thiserror-impl` and `zerofrom` moved to `syn` 3; `asn1-rs`, `der_derive`, `tokio-macros` and `mc-protocol-macros` still use `syn` 2.
  { crate = "syn@2.0.119", reason = "asn1-rs-derive, der_derive, tokio-macros, mc-protocol-macros" },
  { crate = "synstructure@0.13.2", reason = "asn1-rs-derive (syn 2)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Known and unresolved; documented in docs/standards.md.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = """
    `rsa` has no patched release (Marvin timing side channel in the private-key operations). We use `rsa` for vanilla's \
    login key exchange: `mc-protocol` `ServerKeyPair::decrypt` is a private-key PKCS#1 v1.5 decryption of the \
    challenge and shared secret that an unauthenticated client sends in online mode, so the side channel is reachable \
    over the network. The call uses `decrypt_blinded` and every failure answers with the same error and closes the \
    connection, but no mitigation is claimed. The other uses (`mc-game-core` signature verification, \
    `mc-protocol` and `mc-testbot` encryption) only use public keys and are not affected.""" },
]

# Local runs skip the corpus replays: they need several GB per test; run them with `--ignore-default-filter`.
[profile.default]
default-filter = "not (package(mc-datafix) & test(/^samples_corpus::/))"

# cargo-nextest profile of the push and pull request CI (.github/workflows/ci.yml, `--profile ci`).
[profile.ci]
default-filter = "all()"    # the CI runs the corpus replays (one at a time, see the test group below)
retries = 1                 # a test that passes on retry is reported as FLAKY, not as a failure
fail-fast = false
failure-output = "final"
status-level = "fail"
final-status-level = "flaky"
# a hung test is killed after 10 minutes instead of stalling the job
slow-timeout = { period = "60s", terminate-after = 10 }

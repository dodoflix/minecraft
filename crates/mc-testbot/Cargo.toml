[package]
name = "mc-testbot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Scriptable headless client for integration and end-to-end tests"
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "mc_testbot"

[[bin]]
name = "mc-testbot"
path = "src/main.rs"

# Dual-server command corpus runner, driven by scripts/command-diff.sh.
[[bin]]
name = "mc-command-diff"
path = "src/command_diff.rs"

[dependencies]
mc-core = { path = "../mc-core" }
mc-data = { path = "../mc-data" }
mc-nbt = { path = "../mc-nbt" }
mc-text = { path = "../mc-text" }
mc-protocol = { path = "../mc-protocol" }
mc-testkit = { path = "../mc-testkit" }
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
regex = { workspace = true }
sha1 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "macros", "time", "sync", "process", "rt-multi-thread", "fs", "signal"] }
uuid = { workspace = true }

[lints]
workspace = true

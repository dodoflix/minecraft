[package]
name = "mc-testbot"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mc_testbot"

[[bin]]
name = "mc-testbot"
path = "src/main.rs"

# Dual-server command corpus runner, driven by scripts/command-diff.sh.
[[bin]]
name = "mc-command-diff"
path = "src/command_diff.rs"

[dependencies]
mc-core = { path = "../mc-core" }
mc-data = { path = "../mc-data" }
mc-nbt = { path = "../mc-nbt" }
mc-text = { path = "../mc-text" }
mc-protocol = { path = "../mc-protocol" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }
regex = "1"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "net", "rt", "macros", "time", "sync", "process", "rt-multi-thread", "fs", "signal"] }
uuid = "1.29.0"

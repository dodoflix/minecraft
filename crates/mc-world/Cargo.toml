repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mc-core = { path = "../mc-core" }
mc-nbt = { path = "../mc-nbt" }
mc-data = { path = "../mc-data" }
flate2 = "1"
twox-hash = { version = "2", default-features = false, features = ["xxhash32"] }
indexmap = "2"
libc = "0.2"
log = "0.4"

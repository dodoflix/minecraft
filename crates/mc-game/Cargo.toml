[package]
name = "mc-game"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Public API of the gameplay server, assembled from mc-game-core and the area crates"
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mc-game-core = { path = "../mc-game-core" }
mc-game-ai = { path = "../mc-game-ai" }
mc-game-animals = { path = "../mc-game-animals" }
mc-game-blocks = { path = "../mc-game-blocks" }
mc-game-cmds = { path = "../mc-game-cmds" }
mc-game-levelgen = { path = "../mc-game-levelgen" }
mc-game-monsters = { path = "../mc-game-monsters" }

[dev-dependencies]
mc-core = { path = "../mc-core" }
mc-nbt = { path = "../mc-nbt" }
mc-text = { path = "../mc-text" }
mc-brigadier = { path = "../mc-brigadier" }
mc-data = { path = "../mc-data" }
mc-protocol = { path = "../mc-protocol" }
mc-dfu = { path = "../mc-dfu" }
mc-worldgen = { path = "../mc-worldgen" }
mc-world = { path = "../mc-world" }
flate2 = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
proc-macro2 = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true, features = ["full"] }
mc-testkit = { path = "../mc-testkit" }
sha1 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "signal", "test-util"] }
uuid = { workspace = true, features = ["v4"] }
zip = { workspace = true, features = ["deflate-flate2"] }

[lints]
workspace = true

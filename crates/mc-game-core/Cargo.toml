[package]
name = "mc-game-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The gameplay core: server, levels, entities, items, networking and command infrastructure"
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mc-core = { path = "../mc-core" }
mc-nbt = { path = "../mc-nbt" }
mc-text = { path = "../mc-text" }
mc-brigadier = { path = "../mc-brigadier" }
mc-data = { path = "../mc-data" }
mc-protocol = { path = "../mc-protocol" }
mc-dfu = { path = "../mc-dfu" }
mc-worldgen = { path = "../mc-worldgen" }
mc-light = { path = "../mc-light" }
mc-world = { path = "../mc-world" }
zip = { workspace = true, features = ["deflate-flate2"] }
regex = { workspace = true }
linkme = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "signal"] }
indexmap = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
rand = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
signal-hook = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-rustls = { workspace = true }
futures-util = { workspace = true, features = ["std", "sink"] }
p12-keystore = { workspace = true }
rsa = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
sha1 = { workspace = true, features = ["oid"] }
reqwest = { workspace = true, features = ["rustls", "blocking"] }
tempfile = { workspace = true }

[dev-dependencies]
mc-testkit = { path = "../mc-testkit" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

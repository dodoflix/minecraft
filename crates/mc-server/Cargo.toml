[package]
name = "mc-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The dedicated server binary"
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mc-game = { path = "../mc-game" }
mc-world = { path = "../mc-world" }
log = { workspace = true }

[dev-dependencies]
mc-core = { path = "../mc-core" }
mc-data = { path = "../mc-data" }
mc-nbt = { path = "../mc-nbt" }
mc-protocol = { path = "../mc-protocol" }
mc-testbot = { path = "../mc-testbot" }
mc-testkit = { path = "../mc-testkit" }
# `mc-text`, `indexmap` and `parking_lot` are used by the `#[path]` shared test modules of `mc-game`
mc-text = { path = "../mc-text" }
indexmap = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "macros", "time", "sync", "rt-multi-thread"] }
uuid = { workspace = true }

[lints]
workspace = true

[package]
name = "mc-game-blocks"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Block behavior implementations and block entities"
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
parent = { package = "mc-game-core", path = "../mc-game-core" }
mc-core = { path = "../mc-core" }
mc-nbt = { path = "../mc-nbt" }
mc-text = { path = "../mc-text" }
mc-brigadier = { path = "../mc-brigadier" }
mc-data = { path = "../mc-data" }
mc-protocol = { path = "../mc-protocol" }
mc-dfu = { path = "../mc-dfu" }
mc-worldgen = { path = "../mc-worldgen" }
mc-light = { path = "../mc-light" }
mc-world = { path = "../mc-world" }
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
linkme = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "signal"] }
indexmap = "2"
parking_lot = "0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
base64 = "0.22"
chrono = "0.4"
flate2 = "1"
signal-hook = "0.3"
tokio-tungstenite = "0.26"
tokio-rustls = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
p12-keystore = "0.1"
rsa = "0.9.10"
libc = "0.2"
sha2 = { version = "0.10", features = ["oid"] }
sha1 = { version = "0.10", features = ["oid"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true

[package]
name = "mc-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
mc-nbt = { path = "../mc-nbt" }
mc-text = { path = "../mc-text" }
mc-core = { path = "../mc-core" }
mc-data = { path = "../mc-data" }
mc-dfu = { path = "../mc-dfu" }
mc-protocol-macros = { path = "../mc-protocol-macros" }
aes = "0.9.4"
cfb8 = "0.9.1"
flate2 = "1.1.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rsa = "0.9.10"
serde = "1.0.229"
serde_json = { workspace = true }
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "net", "rt", "macros", "time", "sync", "process", "rt-multi-thread"] }
uuid = "1.29.0"

[build-dependencies]
serde_json = { workspace = true }

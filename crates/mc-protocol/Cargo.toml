[package]
name = "mc-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minecraft Java 26.3 wire protocol: codecs, framing, encryption and packets"
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
mc-nbt = { path = "../mc-nbt" }
mc-text = { path = "../mc-text" }
mc-core = { path = "../mc-core" }
mc-data = { path = "../mc-data" }
mc-dfu = { path = "../mc-dfu" }
mc-protocol-macros = { path = "../mc-protocol-macros" }
aes = { workspace = true }
cfb8 = { workspace = true }
flate2 = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
rand_core = { workspace = true, features = ["getrandom"] }
rsa = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "macros", "time", "sync", "rt-multi-thread"] }
uuid = { workspace = true }

[dev-dependencies]
mc-testkit = { path = "../mc-testkit" }

[build-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
